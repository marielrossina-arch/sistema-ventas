<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Ventas - Artesano 3D</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header>
      <h1>Artesano 3D</h1>
      <h2>Imprime tu mundo</h2>
      <h3>Sistema de Ventas</h3>
    </header>

    <main>
      <table id="tabla-ventas">
        <thead>
          <tr>
            <th>categoria</th>
            <th>precio_item</th>
            <th>id_ventas</th>
          </tr>
        </thead>
        <tbody id="cuerpo-ventas"></tbody>
      </table>
      <form id="form-venta">
        <label for="categoria">
          <select id="categoria"></select>
        </label>
        <label for="precio_item">
          <input type="number" id="campo-precio_itemm" min="1" value="1" />
        </label>
        <button type="submit">Registrar Venta</button>
      </form>
      <p id="mensaje-venta"></p>
      <h2>Piezas entregadas</h2>
      <section id="galeria"></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
